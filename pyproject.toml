[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "exomol-rkr"
version = "0.1.0"
description = "RKR potential inversion and Numerov-Cooley solver for diatomic ExoMol spectra."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0",
    "matplotlib>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "scipy>=1.13.0",
]

[project.scripts]
exomol-rkr = "exomol_rkr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/exomol_rkr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
