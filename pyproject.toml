[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "exomol-comphys"
version = "0.1.0"
description = "Inverse Sturm-Liouville potential reconstruction, RKR singular quadrature, and FTIR spectral synthesis on ExoMol diatomic molecules (PHYS 3178)."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0",
    "matplotlib>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "scipy>=1.13.0",
]

[project.scripts]
exomol-comphys = "exomol_comphys.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/exomol_comphys"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
